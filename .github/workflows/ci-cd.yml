name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modular_monolith
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d modular_monolith"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/modular_monolith
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
          JWT_SECRET: ZmFrZV9iYXNlNjRfc2VjcmV0X2tleV9mb3JfdGVzdGluZw==
          JWT_ACCESS_EXPIRATION: 3600000
          JWT_REFRESH_EXPIRATION: 86400000
        run: mvn -B -q -am -pl app test -Dtest=AuthIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Flyway migration check
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/modular_monolith
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
        run: mvn -B -q -pl app flyway:migrate

      - name: Package app
        run: mvn -B -q -DskipTests package

      - name: Build Docker image
        run: docker build -t modular-monolith:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag modular-monolith:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/modular-monolith:${{ github.sha }} && docker push ${{ secrets.DOCKERHUB_USERNAME }}/modular-monolith:${{ github.sha }}
